def downloadToFile = { String sourceUrl, File destination ->
    destination.parentFile.mkdirs()
    new URL(sourceUrl).withInputStream { input ->
        destination.withOutputStream { output ->
            output << input
        }
    }
}

def stripAffixComment = { String line ->
    int commentIndex = line.indexOf('#')
    commentIndex >= 0 ? line.substring(0, commentIndex) : line
}

def findUnescapedSlash = { String value ->
    boolean escaped = false
    for (int index = 0; index < value.length(); index++) {
        char current = value.charAt(index)
        if (escaped) {
            escaped = false
            continue
        }
        if (current == '\\') {
            escaped = true
            continue
        }
        if (current == '/') {
            return index
        }
    }
    -1
}

def parseFlagList = { String rawFlags, String flagMode ->
    if (!rawFlags) {
        return []
    }

    switch (flagMode) {
        case 'long':
            if ((rawFlags.length() & 1) != 0) {
                throw new GradleException("Invalid long flag sequence: ${rawFlags}")
            }
            def flags = new ArrayList<String>(rawFlags.length().intdiv(2))
            for (int index = 0; index < rawFlags.length(); index += 2) {
                flags.add(rawFlags.substring(index, index + 2))
            }
            return flags
        case 'num':
            return rawFlags.split(',').findAll { it }
        case 'UTF-8':
        default:
            def flags = new ArrayList<String>(rawFlags.length())
            rawFlags.each { flags.add(it.toString()) }
            return flags
    }
}

def parseAffixAddition = { String rawAddition, String flagMode ->
    String additionField = rawAddition == '0' ? '' : rawAddition
    int slashIndex = findUnescapedSlash(additionField)
    String addition = slashIndex >= 0 ? additionField.substring(0, slashIndex) : additionField
    String continuationField = slashIndex >= 0 ? additionField.substring(slashIndex + 1) : ''
    [
        addition: addition.replace('\\/', '/'),
        continuationFlags: new LinkedHashSet<String>(parseFlagList(continuationField, flagMode))
    ]
}

def normalizeGeneratedWord = { String word, boolean allowUppercasePronounI ->
    String stripped = word.replace('\r', '').trim()
    if (!stripped) {
        return null
    }

    if (allowUppercasePronounI && stripped == 'I') {
        return 'i'
    }

    if (stripped != stripped.toLowerCase(Locale.ROOT)) {
        return null
    }

    String normalized = stripped.toLowerCase(Locale.ROOT)
    normalized ==~ /[a-z][a-z'-]*/ ? normalized : null
}

def loadAffixConfig = { File affixFile ->
    if (!affixFile.exists()) {
        throw new GradleException("Missing affix source file: ${affixFile}")
    }

    String charsetName = StandardCharsets.UTF_8.name()
    String flagMode = 'short'
    affixFile.withReader(StandardCharsets.ISO_8859_1.name()) { reader ->
        reader.eachLine { line ->
            String normalized = stripAffixComment(line).trim()
            if (normalized.startsWith('SET ')) {
                charsetName = normalized.substring(4).trim()
            } else if (normalized.startsWith('FLAG ')) {
                flagMode = normalized.substring(5).trim()
            }
        }
    }

    def affixConfig = [
        charsetName: charsetName,
        flagMode: flagMode,
        prefixes: [:],
        suffixes: [:],
        circumfixFlags: new LinkedHashSet<String>()
    ]

    affixFile.withReader(charsetName) { reader ->
        reader.eachLine { rawLine ->
            String line = stripAffixComment(rawLine).trim()
            if (!line) {
                return
            }

            def parts = line.split(/\s+/)
            if (parts.length == 0) {
                return
            }

            switch (parts[0]) {
                case 'SET':
                    affixConfig.charsetName = parts[1]
                    break
                case 'FLAG':
                    affixConfig.flagMode = parts[1]
                    break
                case 'CIRCUMFIX':
                    affixConfig.circumfixFlags.addAll(parseFlagList(parts[1], affixConfig.flagMode))
                    break
                case 'PFX':
                case 'SFX':
                    if (parts.length >= 4 && (parts[2] == 'Y' || parts[2] == 'N')) {
                        def affixMap = parts[0] == 'PFX' ? affixConfig.prefixes : affixConfig.suffixes
                        affixMap[parts[1]] = [
                            flag: parts[1],
                            type: parts[0],
                            crossProduct: parts[2] == 'Y',
                            rules: []
                        ]
                        break
                    }

                    if (parts.length < 5) {
                        break
                    }

                    def affixMap = parts[0] == 'PFX' ? affixConfig.prefixes : affixConfig.suffixes
                    def affixDefinition = affixMap[parts[1]]
                    if (affixDefinition == null) {
                        throw new GradleException("Affix rule defined before header in ${affixFile}: ${rawLine}")
                    }

                    def addition = parseAffixAddition(parts[3], affixConfig.flagMode)
                    String strip = parts[2] == '0' ? '' : parts[2].replace('\\/', '/')
                    String condition = parts[4]
                    affixDefinition.rules.add([
                        flag: parts[1],
                        type: parts[0],
                        crossProduct: affixDefinition.crossProduct,
                        strip: strip,
                        add: addition.addition,
                        continuationFlags: addition.continuationFlags,
                        conditionPattern: Pattern.compile(
                            parts[0] == 'PFX' ? "^${condition}.*\$" : ".*${condition}\$"
                        )
                    ])
                    break
                default:
                    break
            }
        }
    }

    affixConfig
}

def loadHunspellEntries = { File dictionaryFile, Map affixConfig ->
    if (!dictionaryFile.exists()) {
        throw new GradleException("Missing dictionary source file: ${dictionaryFile}")
    }

    def entries = new ArrayList<Map<String, Object>>()
    dictionaryFile.withReader(affixConfig.charsetName) { reader ->
        boolean firstLine = true
        reader.eachLine { line ->
            if (firstLine) {
                firstLine = false
                return
            }

            String entryText = line.replace('\r', '').trim()
            if (!entryText) {
                return
            }

            String lexicalEntry = entryText.split(/\t/, 2)[0]
            int slashIndex = findUnescapedSlash(lexicalEntry)
            String rootWord = slashIndex >= 0 ? lexicalEntry.substring(0, slashIndex) : lexicalEntry
            String rawFlags = slashIndex >= 0 ? lexicalEntry.substring(slashIndex + 1) : ''
            entries.add([
                word: rootWord.replace('\\/', '/'),
                flags: new LinkedHashSet<String>(parseFlagList(rawFlags, affixConfig.flagMode))
            ])
        }
    }
    entries
}

def canApplyCrossProduct = { Map state, Map rule ->
    if (rule.type == 'PFX') {
        return !state.suffixApplied || (rule.crossProduct && state.allAppliedAffixes.every { it.crossProduct })
    }
    !state.prefixApplied || (rule.crossProduct && state.allAppliedAffixes.every { it.crossProduct })
}

def matchesAffixRule = { String word, Map rule ->
    if (!rule.conditionPattern.matcher(word).matches()) {
        return false
    }

    if (rule.type == 'PFX') {
        return rule.strip.isEmpty() || word.startsWith(rule.strip)
    }
    rule.strip.isEmpty() || word.endsWith(rule.strip)
}

def applyAffixRule = { String word, Map rule ->
    if (rule.type == 'PFX') {
        return rule.add + word.substring(rule.strip.length())
    }
    return word.substring(0, word.length() - rule.strip.length()) + rule.add
}

def expandDictionaryEntries = { File dictionaryFile, File affixFile, boolean allowUppercasePronounI ->
    def affixConfig = loadAffixConfig(affixFile)
    def entries = loadHunspellEntries(dictionaryFile, affixConfig)
    def normalizedWords = new TreeSet<String>()

    entries.each { entry ->
        String baseWord = normalizeGeneratedWord(entry.word, allowUppercasePronounI)
        if (baseWord == null) {
            return
        }

        normalizedWords.add(baseWord)
        if (entry.flags.isEmpty()) {
            return
        }

        def queue = new ArrayDeque<Map<String, Object>>()
        queue.add([
            word: baseWord,
            availableFlags: new LinkedHashSet<String>(entry.flags),
            usedAffixClasses: new LinkedHashSet<String>(),
            prefixApplied: false,
            suffixApplied: false,
            pendingCircumfix: false,
            allAppliedAffixes: [],
            depth: 0
        ])

        while (!queue.isEmpty()) {
            Map state = queue.removeFirst()
            if (state.depth >= 3) {
                continue
            }

            state.availableFlags.each { String flag ->
                [affixConfig.prefixes[flag], affixConfig.suffixes[flag]].findAll { it != null }.each { affixDefinition ->
                    String affixKey = "${affixDefinition.type}:${affixDefinition.flag}"
                    if (state.usedAffixClasses.contains(affixKey)) {
                        return
                    }
                    affixDefinition.rules.each { rule ->
                        if (!canApplyCrossProduct(state, rule) || !matchesAffixRule(state.word, rule)) {
                            return
                        }

                        String derivedWord = applyAffixRule(state.word, rule)
                        String normalizedDerivedWord =
                            normalizeGeneratedWord(derivedWord, allowUppercasePronounI)
                        if (normalizedDerivedWord == null) {
                            return
                        }

                        boolean prefixApplied = state.prefixApplied || rule.type == 'PFX'
                        boolean suffixApplied = state.suffixApplied || rule.type == 'SFX'
                        boolean pendingCircumfix =
                            state.pendingCircumfix ||
                            !Collections.disjoint(rule.continuationFlags, affixConfig.circumfixFlags)

                        if (!pendingCircumfix || (prefixApplied && suffixApplied)) {
                            normalizedWords.add(normalizedDerivedWord)
                        }

                        def nextAvailableFlags = new LinkedHashSet<String>()
                        state.availableFlags.each { String availableFlag ->
                            if (availableFlag == flag) {
                                return
                            }
                            if (rule.type == 'PFX' && affixConfig.suffixes.containsKey(availableFlag)) {
                                nextAvailableFlags.add(availableFlag)
                                return
                            }
                            if (rule.type == 'SFX' && affixConfig.prefixes.containsKey(availableFlag)) {
                                nextAvailableFlags.add(availableFlag)
                            }
                        }
                        nextAvailableFlags.addAll(rule.continuationFlags)

                        if (nextAvailableFlags.isEmpty()) {
                            return
                        }

                        def nextUsedAffixClasses = new LinkedHashSet<String>(state.usedAffixClasses)
                        nextUsedAffixClasses.add(affixKey)
                        def nextAppliedAffixes = new ArrayList<Map>(state.allAppliedAffixes)
                        nextAppliedAffixes.add([type: rule.type, crossProduct: rule.crossProduct])
                        queue.add([
                            word: normalizedDerivedWord,
                            availableFlags: nextAvailableFlags,
                            usedAffixClasses: nextUsedAffixClasses,
                            prefixApplied: prefixApplied,
                            suffixApplied: suffixApplied,
                            pendingCircumfix: pendingCircumfix,
                            allAppliedAffixes: nextAppliedAffixes,
                            depth: state.depth + 1
                        ])
                    }
                }
            }
        }
    }

    normalizedWords
}

def loadDictionaryEntries = { File sourceFile ->
    if (!sourceFile.exists()) {
        throw new GradleException("Missing dictionary source file: ${sourceFile}")
    }

    def words = new ArrayList<String>()
    sourceFile.withReader(StandardCharsets.UTF_8.name()) { reader ->
        reader.eachLine { line ->
            String normalized = line.trim().toLowerCase(Locale.ROOT)
            if (normalized) {
                words.add(normalized)
            }
        }
    }
    words
}

def commonPrefixLength = { String left, String right ->
    int max = Math.min(left.length(), right.length())
    int index = 0
    while (index < max && left.charAt(index) == right.charAt(index)) {
        index++
    }
    index
}

def writeVarInt = { OutputStream output, int value ->
    int remaining = value
    while ((remaining & ~0x7F) != 0) {
        output.write((remaining & 0x7F) | 0x80)
        remaining >>>= 7
    }
    output.write(remaining)
}

def compileDictionaryBinary = { Collection<String> words, File destination ->
    destination.parentFile.mkdirs()
    destination.withOutputStream { output ->
        output.write([0x41, 0x4B, 0x44, 0x31] as byte[])
        writeVarInt(output, 1)
        writeVarInt(output, words.size())

        String previousWord = ''
        words.each { word ->
            int prefixLength = commonPrefixLength(previousWord, word)
            byte[] suffixBytes = word.substring(prefixLength).getBytes(StandardCharsets.UTF_8)
            writeVarInt(output, prefixLength)
            writeVarInt(output, suffixBytes.length)
            output.write(suffixBytes)
            previousWord = word
        }
    }
}

def generatedDictionaryDir = file("${buildDir}/generated/dictionary-assets")
def compiledDictionaryFile = new File(generatedDictionaryDir, 'dictionary.bin')

tasks.register('updateDictionaries') {
    group = 'dictionary'
    description = 'Downloads and regenerates the English and Indonesian keyboard dictionaries.'

    doLast {
        File downloadDir = file("${buildDir}/tmp/dictionaries")
        File noticesDir = file('third_party/dictionaries')
        noticesDir.mkdirs()

        dictionarySources.each { sourceName, sourceConfig ->
            File downloadedDictionary = new File(downloadDir, "${sourceName}.dic")
            File downloadedAffix = new File(downloadDir, "${sourceName}.aff")

            downloadToFile(sourceConfig.dictionaryUrl, downloadedDictionary)
            downloadToFile(sourceConfig.affixUrl, downloadedAffix)
            downloadToFile(sourceConfig.affixUrl, sourceConfig.affixFile)
            downloadToFile(sourceConfig.readmeUrl, sourceConfig.readmeFile)
            downloadToFile(sourceConfig.licenseUrl, sourceConfig.licenseFile)

            def normalizedWords =
                expandDictionaryEntries(
                    downloadedDictionary,
                    downloadedAffix,
                    sourceConfig.allowUppercasePronounI)
            sourceConfig.sourceFile.parentFile.mkdirs()
            sourceConfig.sourceFile.setText(
                normalizedWords.join('\n') + '\n',
                StandardCharsets.UTF_8.name())
        }

        file('third_party/dictionaries/SOURCES.txt').setText(
            '''Dictionary source files in src/main/dictionaries/ are generated from these upstream LibreOffice dictionary files:

- English: https://raw.githubusercontent.com/LibreOffice/dictionaries/master/en/en_US.dic
  Affix rules: https://raw.githubusercontent.com/LibreOffice/dictionaries/master/en/en_US.aff
- Indonesian: https://raw.githubusercontent.com/LibreOffice/dictionaries/master/id/id_ID.dic
  Affix rules: https://raw.githubusercontent.com/LibreOffice/dictionaries/master/id/id_ID.aff

Generation rules:
- run ./gradlew :KeyBoardApp:updateDictionaries from the repository root
- run ./gradlew :KeyBoardApp:compileDictionaryAsset from the repository root to regenerate the packaged binary asset
- skip the first line because it is the Hunspell entry count
- parse Hunspell .dic and .aff files offline during generation
- expand matching prefix and suffix rules, including continuation classes used by the upstream dictionaries
- keep lowercase single-word entries that match ^[a-z][a-z'-]*$
- special-case the English pronoun "I" to keep it as "i"
- sort and deduplicate the final word list before binary compilation

The APK ships build/generated/dictionary-assets/dictionary.bin instead of the raw text sources.

Upstream affix, license, and README files are copied into this directory.
''',
            StandardCharsets.UTF_8.name())
    }
}

tasks.register('compileDictionaryAsset') {
    group = 'dictionary'
    description = 'Compiles the dictionary source files into the packaged binary dictionary asset.'
    inputs.files(dictionarySources.collect { it.value.sourceFile })
    outputs.file(compiledDictionaryFile)

    doLast {
        def mergedWords = new TreeSet<String>()
        dictionarySources.each { _, sourceConfig ->
            mergedWords.addAll(loadDictionaryEntries(sourceConfig.sourceFile))
        }
        compileDictionaryBinary(mergedWords, compiledDictionaryFile)
    }
}

android { 
    namespace 'armmel.keyboard'
    sourceSets {
        main {
            assets.srcDirs = ['src/main/packaged-assets', generatedDictionaryDir.path]
        }
    }
        defaultConfig { 
            versionCode 20 
                versionName 'Arm Keyboard'
                minSdkVersion 28
                targetSdkVersion 35

        }

        tasks.named('preBuild').configure {
            dependsOn(tasks.named('compileDictionaryAsset'))
        }

    compileSdkVersion 35
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }
    def keystoreProps = new Properties()
    def keystoreFile = rootProject.file("keystore.properties")
    if (keystoreFile.exists()) {
        keystoreProps.load(new FileInputStream(keystoreFile))
    }
    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile file(keystoreProps['storeFile'])
            } else if (System.getenv("RELEASE_STORE_FILE")) {
                storeFile file(System.getenv("RELEASE_STORE_FILE"))
            }
            storePassword keystoreProps['storePassword'] ?: System.getenv("RELEASE_STORE_PASSWORD")
            keyAlias keystoreProps['keyAlias'] ?: System.getenv("RELEASE_KEY_ALIAS")
            keyPassword keystoreProps['keyPassword'] ?: System.getenv("RELEASE_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            zipAlignEnabled true
        }
        release {
            signingConfig signingConfigs.release
        }
    }

}
