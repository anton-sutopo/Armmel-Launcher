apply plugin: 'com.android.application'

import java.net.URL
import java.nio.charset.StandardCharsets
import org.gradle.api.GradleException

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

}

/*Gets the version name from the latest Git tag */ 

def dictionarySources = [
    english: [
        sourceFile: file('src/main/dictionaries/dictionary_en.txt'),
        dictionaryUrl: 'https://raw.githubusercontent.com/LibreOffice/dictionaries/master/en/en_US.dic',
        readmeFile: file('third_party/dictionaries/README_en_US.txt'),
        readmeUrl: 'https://raw.githubusercontent.com/LibreOffice/dictionaries/master/en/README_en_US.txt',
        licenseFile: file('third_party/dictionaries/LICENSE_en.txt'),
        licenseUrl: 'https://raw.githubusercontent.com/LibreOffice/dictionaries/master/en/license.txt',
        allowUppercasePronounI: true
    ],
    indonesian: [
        sourceFile: file('src/main/dictionaries/dictionary_id.txt'),
        dictionaryUrl: 'https://raw.githubusercontent.com/LibreOffice/dictionaries/master/id/id_ID.dic',
        readmeFile: file('third_party/dictionaries/README_id.txt'),
        readmeUrl: 'https://raw.githubusercontent.com/LibreOffice/dictionaries/master/id/README-dict.adoc',
        licenseFile: file('third_party/dictionaries/LICENSE_id.txt'),
        licenseUrl: 'https://raw.githubusercontent.com/LibreOffice/dictionaries/master/id/LICENSE-dict',
        allowUppercasePronounI: false
    ]
]

def downloadToFile = { String sourceUrl, File destination ->
    destination.parentFile.mkdirs()
    new URL(sourceUrl).withInputStream { input ->
        destination.withOutputStream { output ->
            output << input
        }
    }
}

def normalizeDictionaryEntries = { File sourceFile, boolean allowUppercasePronounI ->
    def normalizedWords = new TreeSet<String>()
    sourceFile.withReader(StandardCharsets.UTF_8.name()) { reader ->
        boolean firstLine = true
        reader.eachLine { line ->
            if (firstLine) {
                firstLine = false
                return
            }

            String stripped = line.replace('\r', '')
            int slashIndex = stripped.indexOf('/')
            if (slashIndex >= 0) {
                stripped = stripped.substring(0, slashIndex)
            }
            stripped = stripped.trim()
            if (!stripped) {
                return
            }

            if (allowUppercasePronounI && stripped == 'I') {
                normalizedWords.add('i')
                return
            }

            if (stripped != stripped.toLowerCase(Locale.ROOT)) {
                return
            }

            String normalized = stripped.toLowerCase(Locale.ROOT)
            if (normalized ==~ /[a-z][a-z'-]*/) {
                normalizedWords.add(normalized)
            }
        }
    }
    normalizedWords
}

def loadDictionaryEntries = { File sourceFile ->
    if (!sourceFile.exists()) {
        throw new GradleException("Missing dictionary source file: ${sourceFile}")
    }

    def words = new ArrayList<String>()
    sourceFile.withReader(StandardCharsets.UTF_8.name()) { reader ->
        reader.eachLine { line ->
            String normalized = line.trim().toLowerCase(Locale.ROOT)
            if (normalized) {
                words.add(normalized)
            }
        }
    }
    words
}

def commonPrefixLength = { String left, String right ->
    int max = Math.min(left.length(), right.length())
    int index = 0
    while (index < max && left.charAt(index) == right.charAt(index)) {
        index++
    }
    index
}

def writeVarInt = { OutputStream output, int value ->
    int remaining = value
    while ((remaining & ~0x7F) != 0) {
        output.write((remaining & 0x7F) | 0x80)
        remaining >>>= 7
    }
    output.write(remaining)
}

def compileDictionaryBinary = { Collection<String> words, File destination ->
    destination.parentFile.mkdirs()
    destination.withOutputStream { output ->
        output.write([0x41, 0x4B, 0x44, 0x31] as byte[])
        writeVarInt(output, 1)
        writeVarInt(output, words.size())

        String previousWord = ''
        words.each { word ->
            int prefixLength = commonPrefixLength(previousWord, word)
            byte[] suffixBytes = word.substring(prefixLength).getBytes(StandardCharsets.UTF_8)
            writeVarInt(output, prefixLength)
            writeVarInt(output, suffixBytes.length)
            output.write(suffixBytes)
            previousWord = word
        }
    }
}

def generatedDictionaryDir = file("${buildDir}/generated/dictionary-assets")
def compiledDictionaryFile = new File(generatedDictionaryDir, 'dictionary.bin')

tasks.register('updateDictionaries') {
    group = 'dictionary'
    description = 'Downloads and regenerates the English and Indonesian keyboard dictionaries.'

    doLast {
        File downloadDir = file("${buildDir}/tmp/dictionaries")
        File noticesDir = file('third_party/dictionaries')
        noticesDir.mkdirs()

        dictionarySources.each { sourceName, sourceConfig ->
            File downloadedDictionary = new File(downloadDir, "${sourceName}.dic")

            downloadToFile(sourceConfig.dictionaryUrl, downloadedDictionary)
            downloadToFile(sourceConfig.readmeUrl, sourceConfig.readmeFile)
            downloadToFile(sourceConfig.licenseUrl, sourceConfig.licenseFile)

            def normalizedWords =
                normalizeDictionaryEntries(downloadedDictionary, sourceConfig.allowUppercasePronounI)
            sourceConfig.sourceFile.parentFile.mkdirs()
            sourceConfig.sourceFile.setText(
                normalizedWords.join('\n') + '\n',
                StandardCharsets.UTF_8.name())
        }

        file('third_party/dictionaries/SOURCES.txt').setText(
            '''Dictionary source files in src/main/dictionaries/ are generated from these upstream LibreOffice dictionary files:

- English: https://raw.githubusercontent.com/LibreOffice/dictionaries/master/en/en_US.dic
- Indonesian: https://raw.githubusercontent.com/LibreOffice/dictionaries/master/id/id_ID.dic

Generation rules:
- run ./gradlew :KeyBoardApp:updateDictionaries from the repository root
- run ./gradlew :KeyBoardApp:compileDictionaryAsset from the repository root to regenerate the packaged binary asset
- skip the first line because it is the Hunspell entry count
- strip Hunspell flags by removing everything after the first slash
- keep lowercase single-word entries that match ^[a-z][a-z'-]*$
- special-case the English pronoun "I" to keep it as "i"
- sort and deduplicate the final word list before binary compilation

The APK ships build/generated/dictionary-assets/dictionary.bin instead of the raw text sources.

Upstream license and README files are copied into this directory.
''',
            StandardCharsets.UTF_8.name())
    }
}

tasks.register('compileDictionaryAsset') {
    group = 'dictionary'
    description = 'Compiles the dictionary source files into the packaged binary dictionary asset.'
    inputs.files(dictionarySources.collect { it.value.sourceFile })
    outputs.file(compiledDictionaryFile)

    doLast {
        def mergedWords = new TreeSet<String>()
        dictionarySources.each { _, sourceConfig ->
            mergedWords.addAll(loadDictionaryEntries(sourceConfig.sourceFile))
        }
        compileDictionaryBinary(mergedWords, compiledDictionaryFile)
    }
}

android { 
    namespace 'armmel.keyboard'
    sourceSets {
        main {
            assets.srcDirs = ['src/main/packaged-assets', generatedDictionaryDir.path]
        }
    }
        defaultConfig { 
            versionCode 20 
                versionName 'Arm Keyboard'
                minSdkVersion 28
                targetSdkVersion 35

        }

        tasks.named('preBuild').configure {
            dependsOn(tasks.named('compileDictionaryAsset'))
        }

    compileSdkVersion 35
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }
    def keystoreProps = new Properties()
    def keystoreFile = rootProject.file("keystore.properties")
    if (keystoreFile.exists()) {
        keystoreProps.load(new FileInputStream(keystoreFile))
    }
    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile file(keystoreProps['storeFile'])
            } else if (System.getenv("RELEASE_STORE_FILE")) {
                storeFile file(System.getenv("RELEASE_STORE_FILE"))
            }
            storePassword keystoreProps['storePassword'] ?: System.getenv("RELEASE_STORE_PASSWORD")
            keyAlias keystoreProps['keyAlias'] ?: System.getenv("RELEASE_KEY_ALIAS")
            keyPassword keystoreProps['keyPassword'] ?: System.getenv("RELEASE_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            zipAlignEnabled true
        }
        release {
            signingConfig signingConfigs.release
        }
    }

}
